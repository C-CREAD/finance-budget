{% extends "incomes.html" %}
{% block content %}

<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
    }
    .form-header {
        border-bottom: 1px solid #eee;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
    }
</style>
<div class="form-container">
    <div class="form-header">
        <h1 class="display-4 text-primary">
            <i class="fas fa-edit mr-2"></i>Update Income
        </h1>
        <p class="lead">Modify your income details below</p>
    </div>

    <div class="card border-primary">
        <div class="card-header bg-primary text-white">
            <h4><i class="fas fa-money-bill-wave mr-2"></i>Income Details</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="name">Income Source</label>
                    <input type="text" class="form-control" id="name" name="name"
                           value="{{ income_record[1] }}" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" class="form-control" id="amount" name="amount"
                           min="0" step="0.01" value="{{ income_record[2] }}" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" class="form-control" id="category" name="category"
                           value="{{ income_record[3] }}" required>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save mr-2"></i>Update
                    </button>
                    <a href="{{ url_for('incomes') }}" class="btn btn-outline-secondary btn-lg ml-2">
                        <i class="fas fa-times mr-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
