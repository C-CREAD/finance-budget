{% extends "expenses.html" %}
{% block content %}

<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
    }
    .form-header {
        border-bottom: 1px solid #eee;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
    }
</style>
<div class="form-container">
    <div class="form-header">
        <h1 class="display-4 text-danger">
            <i class="fas fa-plus-circle mr-2"></i>New Expense
        </h1>
        <p class="lead">Record a new expense to track your spending</p>
    </div>

    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h4><i class="fas fa-receipt mr-2"></i>Expense Details</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="name">Expense Name</label>
                    <input type="text" class="form-control" id="name" name="name"
                           placeholder="e.g. Grocery Shopping" required>
                    <small class="form-text text-muted">Describe what you spent money on</small>
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" class="form-control" id="amount" name="amount"
                           min="0" step="0.01" placeholder="0.00" required>
                    <small class="form-text text-muted">Enter the amount spent</small>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" class="form-control" id="category" name="category"
                           placeholder="e.g. Food, Transportation" required>
                    <small class="form-text text-muted">Categorize your expense</small>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="fas fa-save mr-2"></i>Add Expense
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
