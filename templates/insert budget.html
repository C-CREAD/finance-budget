{% extends "budgets.html" %}
{% block content %}

<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
    }
    .form-header {
        border-bottom: 1px solid #eee;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
    }
    .form-control {
        height: calc(1.5em + 1rem + 2px);
        padding: 0.5rem 1rem;
    }
</style>
<div class="form-container">
    <div class="form-header">
        <h1 class="display-4 text-success">
            <i class="fas fa-plus-circle mr-2"></i>New Budget
        </h1>
        <p class="lead">Create a new budget to track your financial goals</p>
    </div>

    <div class="card border-success">
        <div class="card-header bg-success text-white">
            <h4><i class="fas fa-chart-pie mr-2"></i>Budget Details</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label for="name">Budget Name</label>
                    <input type="text" class="form-control" id="name" name="name"
                           placeholder="e.g. Monthly Groceries" required>
                    <small class="form-text text-muted">Give your budget a descriptive name</small>
                </div>

                <div class="form-group">
                    <label for="amount">Budget Amount ($)</label>
                    <input type="number" class="form-control" id="amount" name="amount"
                           min="0" step="0.01" placeholder="0.00" required>
                    <small class="form-text text-muted">Enter the total amount you want to budget</small>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" class="form-control" id="category" name="category"
                           placeholder="e.g. Food, Utilities" required>
                    <small class="form-text text-muted">Categorize your budget for better tracking</small>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-save mr-2"></i>Create Budget
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
